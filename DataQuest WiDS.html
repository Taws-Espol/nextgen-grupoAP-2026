<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataQuest WiDS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { width: 100%; min-height: 100%; }
    html, body { overflow-y: auto; }
    #root { overflow: visible; }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #0B0B1A;
      color: #E8E8FF;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(157,110,248,0.3); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(157,110,248,0.5); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes popIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
    @keyframes xpFloat { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-40px); } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    @keyframes rankUp { 0% { transform: translateY(20px); opacity: 0; } 60% { transform: translateY(-4px); } 100% { transform: translateY(0); opacity: 1; } }
    @keyframes glow { 0%,100% { box-shadow: 0 0 20px rgba(157,110,248,0.3); } 50% { box-shadow: 0 0 40px rgba(157,110,248,0.6); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes barGrow { from { transform: scaleY(0); transform-origin: bottom; } to { transform: scaleY(1); transform-origin: bottom; } }
    @keyframes dotPop { 0% { transform: scale(0); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }

    .fade-in { animation: fadeIn 0.3s ease forwards; }
    .pop-in { animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    .pulse { animation: pulse 2s infinite; }
    .glow { animation: glow 3s infinite; }

    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 20px rgba(34, 211, 238, 0.3); }
      50% { box-shadow: 0 0 40px rgba(157, 110, 248, 0.6); }
    }

    @keyframes electricFlash {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .nucleus-glow { animation: glowPulse 0.6s ease-in-out; }
    .electric-bar { animation: electricFlash 0.4s ease; }

    button:hover { filter: brightness(1.1); }
    button:active { transform: scale(0.97); }

    input, textarea, select {
      font-family: 'Space Grotesk', sans-serif;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #E8E8FF;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      width: 100%;
    }
    input:focus, textarea:focus, select:focus {
      border-color: rgba(157,110,248,0.6);
      box-shadow: 0 0 0 3px rgba(157,110,248,0.12);
    }
    input::placeholder, textarea::placeholder { color: #7777AA; }
    select option { background: #1A1A35; }

    .drag-col { cursor: grab; user-select: none; }
    .drag-col:active { cursor: grabbing; }
    .drop-zone-active { border-color: rgba(157,110,248,0.8) !important; box-shadow: 0 0 20px rgba(157,110,248,0.2) !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="dq-core.jsx"></script>
  <script type="text/babel" src="screens/CorrelacionesScreen.jsx"></script>
  <script type="text/babel" src="dq-screens.jsx"></script>
  <script type="text/babel" src="dq-app.jsx"></script>
</body>
</html>
